.now-playing-label{position:absolute;top:30px;left:30px;color:var(--orange-light);font-size:12px;letter-spacing:2px;z-index:2}.heart-btn{position:absolute;top:24px;right:24px;width:50px;height:50px;background:transparent;border:none;color:white;font-size:30px;z-index:2}

.time-row{display:flex;justify-content:space-between;margin:10px 0;color:#c5c5c5;font-size:14px}input[type=range]{width:100%;accent-color:var(--orange);cursor:pointer}
.controls{display:flex;align-items:center;justify-content:center;gap:26px;margin:28px 0}.control{width:58px;height:58px;border:none;border-radius:50%;background:transparent;color:white;font-size:24px}.control:hover{color:var(--orange)}
.play-btn{width:95px;height:95px;border-radius:50%;background:#11151a;border:2px solid var(--orange);color:white;font-size:36px;box-shadow:0 0 30px rgba(255,106,0,.22)}.play-btn:hover{transform:scale(1.05);background:var(--orange)}
.volume-box{display:flex;align-items:center;gap:14px;padding:16px 0 0;border-top:1px solid var(--line)}.volume-box span{min-width:45px;color:var(--muted)}
.sidebar{border:1px solid var(--line);border-radius:24px;background:rgba(10,12,15,.92);overflow:hidden}

.playlist-header{display:flex;justify-content:space-between;padding:0 24px 16px;color:var(--orange-light)}.playlist-header span{color:var(--muted)}.playlist{max-height:610px;overflow-y:auto}
.song{display:grid;grid-template-columns:35px 60px 1fr 20px;gap:12px;align-items:center;margin:0 12px;padding:12px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.song.active{border:1px solid var(--orange);border-radius:16px;background:linear-gradient(90deg,rgba(255,106,0,.13),transparent)}.song-number{color:var(--muted);font-size:13px}.song-cover{width:60px;height:60px;border-radius:10px;object-fit:cover}.song-title{font-size:16px}.song-artist{margin-top:7px;color:var(--muted);font-size:13px}.remove-btn{background:transparent;border:none;color:var(--muted);font-size:20px}.remove-btn:hover{color:#ff5555}
.add-song{padding:18px 24px;border-top:1px solid var(--line)}.add-row{display:flex;gap:10px}.youtube-input{width:100%;height:46px;padding:0 14px;color:white;background:#07090c;border:1px solid var(--line);border-radius:12px;outline:none}.youtube-input:focus{border-color:var(--orange)}.add-btn{padding:0 18px;border:none;border-radius:12px;background:var(--orange);color:white;font-weight:bold}

footer{display:flex;justify-content:space-between;gap:20px;margin-top:22px;padding:18px 10px;color:var(--muted);font-size:12px;letter-spacing:3px}.safe{color:var(--orange-light)}

<script>
const DEFAULT_SONGS=[{title:"YouTube Demo",artist:"RAAHI MUSIC",id:"M7lc1UVf-VE"}];
const ADMIN_PIN="2468";
const ADMIN_KEY="raahi_admin_v4";
const SONGS_KEY="raahi_songs_v4";
let songs=loadSongs();
let player,ready=false,currentSong=0,shuffle=false,repeat=false;
const $=id=>document.getElementById(id);
function loadSongs(){try{const saved=JSON.parse(localStorage.getItem(SONGS_KEY)||"null");if(Array.isArray(saved)&&saved.length)return saved;}catch(e){}return DEFAULT_SONGS.map(s=>({...s}));}
function saveSongs(){try{localStorage.setItem(SONGS_KEY,JSON.stringify(songs));}catch(e){}}
function isAdmin(){return sessionStorage.getItem(ADMIN_KEY)==="1";}
function updateAdminUI(){const add=document.querySelector('.add-song');if(add)add.style.display=isAdmin()?"block":"none";document.querySelectorAll('.remove-btn').forEach(b=>b.style.display=isAdmin()?"":"none");let badge=document.getElementById('raahi-admin-badge');if(badge)badge.remove();if(isAdmin()){badge=document.createElement('button');badge.id='raahi-admin-badge';badge.textContent='🔓 ADMIN • LOGOUT';Object.assign(badge.style,{position:'fixed',right:'14px',bottom:'14px',zIndex:'99999',padding:'10px 14px',borderRadius:'999px',border:'1px solid #ff6a00',background:'#111',color:'#ff9a3c',fontWeight:'700',cursor:'pointer'});badge.onclick=()=>{sessionStorage.removeItem(ADMIN_KEY);updateAdminUI();renderPlaylist()};document.body.appendChild(badge);}}
function adminLogin(){if(isAdmin()){sessionStorage.removeItem(ADMIN_KEY);updateAdminUI();renderPlaylist();return;}const pin=prompt("RAAHI MUSIC Admin PIN:");if(pin===null)return;if(pin===ADMIN_PIN){sessionStorage.setItem(ADMIN_KEY,"1");updateAdminUI();renderPlaylist();alert("Admin mode enabled.");}else alert("Incorrect Admin PIN.");}
function installAdminTrigger(){const brand=document.querySelector('.brand');if(!brand||brand.dataset.adminReady)return;brand.dataset.adminReady='1';let taps=0,timer=null;brand.addEventListener('click',()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;adminLogin();}});}

document.addEventListener("DOMContentLoaded",()=>{installAdminTrigger();updateAdminUI();});
function onYouTubeIframeAPIReady(){player=new YT.Player("youtube-player",{height:"200",width:"300",videoId:songs[0].id,playerVars:{controls:0,playsinline:1,rel:0},events:{onReady:onPlayerReady,onStateChange:onStateChange,onError:()=>alert("This YouTube video cannot be played. Try another link.")}})}
function onPlayerReady(){ready=true;player.setVolume(80);updateUI();renderPlaylist();setInterval(updateProgress,500)}
function onStateChange(e){if(e.data===YT.PlayerState.PLAYING)$("playBtn").textContent="❚❚";if(e.data===YT.PlayerState.PAUSED)$("playBtn").textContent="▶";if(e.data===YT.PlayerState.ENDED){if(repeat){player.seekTo(0);player.playVideo()}else nextSong()}}
$("playBtn").onclick=()=>{if(!ready)return;player.getPlayerState()===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo()};
function nextSong(){if(shuffle&&songs.length>1){let n;do{n=Math.floor(Math.random()*songs.length)}while(n===currentSong);currentSong=n}else currentSong=(currentSong+1)%songs.length;loadSong(true)}
$("nextBtn").onclick=nextSong;$("prevBtn").onclick=()=>{currentSong=(currentSong-1+songs.length)%songs.length;loadSong(true)};
function loadSong(autoplay=true){if(!ready)return;player.loadVideoById(songs[currentSong].id);updateUI();renderPlaylist();if(!autoplay)player.pauseVideo()}
function updateUI(){$("currentTitle").textContent=songs[currentSong].title;$("currentArtist").textContent=songs[currentSong].artist}
function updateProgress(){if(!ready)return;let d=player.getDuration(),c=player.getCurrentTime();if(d>0){$("progress").value=c/d*100;$("currentTime").textContent=formatTime(c);$("duration").textContent=formatTime(d)}}
$("progress").oninput=()=>{if(ready&&player.getDuration())player.seekTo($("progress").value/100*player.getDuration(),true)};
$("volume").oninput=()=>{let v=+$("volume").value;$("volumeValue").textContent=v+"%";if(ready)player.setVolume(v)};
$("shuffleBtn").onclick=()=>{shuffle=!shuffle;$("shuffleBtn").style.color=shuffle?"#ff6a00":"white"};$("repeatBtn").onclick=()=>{repeat=!repeat;$("repeatBtn").style.color=repeat?"#ff6a00":"white"};
$("heartBtn").onclick=()=>{$("heartBtn").textContent=$("heartBtn").textContent==="♡"?"♥":"♡";$("heartBtn").style.color=$("heartBtn").textContent==="♥"?"#ff6a00":"white"};

function extractYoutubeId(url){for(const p of[/youtu\.be\/([^?&/]+)/,/youtube\.com\/watch\?v=([^?&/]+)/,/youtube\.com\/shorts\/([^?&/]+)/,/youtube\.com\/embed\/([^?&/]+)/,/youtube\.com\/live\/([^?&/]+)/]){const m=url.match(p);if(m)return m[1]}return /^[a-zA-Z0-9_-]{11}$/.test(url)?url:null}
function addSong(){let url=$("youtubeUrl").value.trim(),id=extractYoutubeId(url);if(!id)return alert("Please enter a valid YouTube link.");songs.push({title:"YouTube Track "+(songs.length+1),artist:"Custom YouTube Song",id});saveSongs();currentSong=songs.length-1;$("youtubeUrl").value="";renderPlaylist();loadSong(false)}

function formatTime(s){if(!s||isNaN(s))return"0:00";return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
function escapeHTML(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
